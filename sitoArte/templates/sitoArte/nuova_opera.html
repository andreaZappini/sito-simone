{% load static %}

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Nuova Opera</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f5f5f5; }
        .nav-dashboard {
            background: #111;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-dashboard a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-dashboard a:hover { opacity: 0.7; }
        .container-box {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="nav-dashboard">
        <a href="/gestione/">Dashboard</a>
        <a href="/gestione/logout/">Logout</a>
    </div>

    <div class="container-box">

        <h2 class="mb-4">Aggiungi Nuova Opera</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Titolo</label>
                <input name="titolo" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Anno</label>
                <input name="anno" type="number" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descrizione</label>
                <textarea name="descrizione" class="form-control" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Immagine Principale</label>
                <input type="file" name="immaginePrincipale" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Immagini Extra</label>
                <input type="file" name="immagini" class="form-control" multiple>
            </div>

            <div class="mb-3">
                <label class="form-label">Video</label>
                <input type="file" name="video" class="form-control" multiple>
            </div>

            <button class="btn btn-dark">Salva Opera</button>
        </form>
    </div>

</body>
</html>
