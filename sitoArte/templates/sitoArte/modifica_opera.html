{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Opera</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f5f5f5; }
        .nav-dashboard {
            background: #111;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-dashboard a {
            color: white; text-decoration: none; font-weight: 500;
        }
        .nav-dashboard a:hover { opacity: .7; }
        .container-box {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }
        .thumb {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body>

    <div class="nav-dashboard">
        <a href="/gestione/">Dashboard</a>
        <a href="/gestione/logout/">Logout</a>
    </div>

    <div class="container-box">

        <h2>Modifica Opera</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Titolo</label>
                <input name="titolo" class="form-control" value="{{ opera.titolo }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Anno</label>
                <input name="anno" type="number" class="form-control" value="{{ opera.anno }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Descrizione</label>
                <textarea name="descrizione" class="form-control" rows="4">{{ opera.descrizione }}</textarea>
            </div>

            <!-- IMMAGINE PRINCIPALE -->
            <div class="mb-3">
                <label class="form-label">Immagine Principale Attuale</label><br>
                <img src="{{ opera.immaginePrincipale.url }}" class="thumb mb-3" style="max-width: 300px;">
                <input type="file" name="immaginePrincipale" class="form-control">
            </div>

            <!-- IMMAGINI EXTRA -->
            <div class="mb-3">
                <label class="form-label">Immagini Extra Attuali</label>
                <div class="row">
                    {% for img in immagini %}
                    <div class="col-md-4">
                        <img src="{{ img.immagine.url }}" class="thumb mb-3">
                    </div>
                    {% endfor %}
                </div>

                <label class="form-label mt-2">Aggiungi nuove immagini</label>
                <input type="file" name="immagini" class="form-control" multiple>
            </div>

            <!-- VIDEO -->
            <div class="mb-3">
                <label class="form-label">Video Attuali</label>
                {% for vid in video %}
                <video width="100%" class="mt-2 rounded shadow" controls>
                    <source src="{{ vid.video.url }}">
                </video>
                {% endfor %}

                <label class="form-label mt-2">Aggiungi nuovi video</label>
                <input type="file" name="video" class="form-control" multiple>
            </div>

            <button class="btn btn-dark">Salva Modifiche</button>
        </form>

    </div>

</body>
</html>
